

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10111a">
  <title>Axion AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <span>Axion <b>AI</b></span>
      </div>

      <button class="new-chat" id="newChat">＋ <span>New chat</span></button>
      <div class="side-label">RECENT CHATS</div>
      <div class="history" id="history"></div>

      <div class="sidebar-bottom">
        <button class="side-action" id="themeToggle">☼ <span>Toggle appearance</span></button>
        <div class="profile">
          <div class="avatar">A</div>
          <div><strong>Axion AI</strong><small>Independent AI project</small></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="mobile-brand">✦ Axion AI</div>
        <div class="model-pill"><span class="status-dot"></span> Axion Core 1.0</div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-symbol">✦</div>
          <p class="eyebrow">WELCOME TO THE FUTURE</p>
          <h1>What shall we<br><span>discover today?</span></h1>
          <p class="welcome-copy">Meet Axion AI. A new intelligence, built from the ground up.</p>

          <div class="suggestions">
            <button class="suggestion" data-prompt="What is artificial intelligence?">
              <span>✧</span><b>Learn something</b><small>Explore new knowledge</small>
            </button>
            <button class="suggestion" data-prompt="Give me five creative ideas.">
              <span>✎</span><b>Brainstorm ideas</b><small>Discover new possibilities</small>
            </button>
            <button class="suggestion" data-prompt="Teach me JavaScript.">
              <span>⌘</span><b>Learn coding</b><small>Build something amazing</small>
            </button>
            <button class="suggestion" data-prompt="Tell me an exciting story.">
              <span>✧</span><b>Create a story</b><small>Explore your imagination</small>
            </button>
          </div>
        </div>

        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" placeholder="Message Axion AI..." aria-label="Message Axion AI"></textarea>
          <button class="send-button" id="sendButton" type="submit">↑</button>
        </form>
        <p class="disclaimer">Axion AI 1.0 • Built with JavaScript</p>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
